<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a120c" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="SportMatrix — The complete digital operating system for sports turfs and facilities." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>SportMatrix — Sports Business Operating System</title>
  </head>
  <body>
    <div id="root">
      <!-- ⚡ ULTRA-FAST ZERO-LAG HARDWARE-ACCELERATED PRELOADER -->
      <style>
        @keyframes smPulseRing {
          0% { transform: scale(0.95); opacity: 0.7; }
          50% { transform: scale(1.05); opacity: 1; }
          100% { transform: scale(0.95); opacity: 0.7; }
        }
        @keyframes smProgressShimmer {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(100%); }
        }
        .sm-preloader {
          position: fixed;
          inset: 0;
          background: #08100a;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 99999;
          font-family: 'Inter', system-ui, -apple-system, sans-serif;
          transition: opacity 0.15s ease-out;
          will-change: opacity;
        }
        .sm-preloader.fade-out {
          opacity: 0;
          pointer-events: none;
        }
        .sm-logo-box {
          position: relative;
          width: 72px;
          height: 72px;
          border-radius: 20px;
          background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
          display: flex;
          align-items: center;
          justify-content: center;
          color: #ffffff;
          font-weight: 900;
          font-size: 26px;
          box-shadow: 0 10px 30px rgba(22, 163, 74, 0.4);
          animation: smPulseRing 2s infinite ease-in-out;
          margin-bottom: 20px;
          will-change: transform;
        }
        .sm-title {
          color: #ffffff;
          font-size: 22px;
          font-weight: 900;
          letter-spacing: 2px;
          text-transform: uppercase;
          font-style: italic;
          margin-bottom: 4px;
        }
        .sm-title span {
          color: #c8ff2e;
        }
        .sm-subtitle {
          color: #10b981;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 2px;
          text-transform: uppercase;
          margin-bottom: 18px;
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .sm-progress-bar {
          width: 200px;
          height: 4px;
          background: rgba(255, 255, 255, 0.1);
          border-radius: 99px;
          overflow: hidden;
          position: relative;
        }
        .sm-progress-fill {
          position: absolute;
          inset: 0;
          background: linear-gradient(90deg, #16a34a, #c8ff2e, #16a34a);
          border-radius: 99px;
          animation: smProgressShimmer 1.2s infinite linear;
          will-change: transform;
        }
      </style>

      <div class="sm-preloader">
        <div class="sm-logo-box">SM</div>
        <div class="sm-title">SportMatrix<span>.</span></div>
        <div class="sm-subtitle">🏏 Initializing Arena...</div>
        <div class="sm-progress-bar">
          <div class="sm-progress-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
